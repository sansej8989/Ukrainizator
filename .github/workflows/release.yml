name: Release

# Запускається автоматично, коли ви пушите тег виду v5.0.0, v5.1.0 і т.д.
# Нічого запускати вручну не треба - досить один раз протегувати коміт:
#
#   git tag v5.0.0
#   git push origin v5.0.0
#
"on":
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 for ukrainizator.ps1 (integrity check feature)
        run: |
          sha256sum ukrainizator.ps1 | awk '{print $1}' > ukrainizator.ps1.sha256
          cat ukrainizator.ps1.sha256

      - name: Package release archive
        run: |
          mkdir -p dist/Ukrainizator
          cp ukrainizator.ps1 dist/Ukrainizator/
          cp ukrainizator.ps1.sha256 dist/Ukrainizator/
          cp bootstrap.ps1 dist/Ukrainizator/ 2>/dev/null || true
          cp run_AUTO.bat dist/Ukrainizator/ 2>/dev/null || true
          cp run_MANUAL.bat dist/Ukrainizator/ 2>/dev/null || true
          cp -r locales dist/Ukrainizator/
          cd dist && zip -r ../Ukrainizator.zip Ukrainizator

      - name: Generate SHA-256 for the release archive
        run: sha256sum Ukrainizator.zip | awk '{print $1}' > Ukrainizator.zip.sha256

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Українізатор v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            Ukrainizator.zip
            Ukrainizator.zip.sha256
            ukrainizator.ps1.sha256
